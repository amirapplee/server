name: macOS-Ngrok-Simple

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360
    
    steps:
      - name: فعال کردن SSH
        run: sudo systemsetup -setremotelogin on
      
      - name: نصب Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          brew install ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ngrok tcp 22 > /dev/null &
          sleep 8
          
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "🌐 آدرس عمومی Ngrok (از لاگ بالا پیدا کن)"
          echo "کاربر: runner"
          echo "رمز نیازی نیست - با کلید SSH قبلی وصل شو"
          echo "═══════════════════════════════════════════════════"
          
          sleep 6h
