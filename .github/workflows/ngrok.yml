name: macOS-SSH-Public

on:
  workflow_dispatch:

jobs:
  macos-ngrok:
    runs-on: macos-latest
    timeout-minutes: 360
    
    steps:
      - name: فعال کردن SSH
        run: |
          sudo systemsetup -setremotelogin on
          
          # تنظیم رمز
          PASSWORD=$(openssl rand -base64 12)
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
          sudo dscl . -passwd /Users/runner "$PASSWORD"
      
      - name: نصب Ngrok
        run: |
          # دانلود ngrok
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip -o ngrok.zip
          unzip -o ngrok.zip
          sudo mv ngrok /usr/local/bin/
          rm ngrok.zip
          
          # احراز هویت
          ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
      
      - name: اجرای تونل Ngrok
        run: |
          # اجرا در پس‌زمینه برای SSH
          ngrok tcp 22 > /dev/null &
          
          # صبر برای دریافت آدرس
          sleep 5
          
          # گرفتن آدرس عمومی
          sleep 10
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
      
      - name: نمایش اطلاعات
        run: |
          echo ""
          echo "========== macOS (Public IP) =========="
          echo "آدرس Ngrok رو از لاگ بالا پیدا کن"
          echo "کاربر: runner"
          echo "رمز: ${{ env.PASSWORD }}"
          echo "======================================="
          
          # نگهداری
          while true; do
            echo "[$(date)] فعال - برای خروج Ctrl+C بزن"
            sleep 300
          done
